<svg width="100%" height="180" viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="780" height="160" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardGlow)" />
  <rect x="10" y="10" width="780" height="160" rx="16" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Logo Mark Container (x=45, y=30, size=120) -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#0b1329" stroke="url(#primaryGrad)" stroke-width="2.5" />
    <!-- Radar Waves -->
    <path d="M20 46 C42 26, 78 26, 100 46" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.6" />
    <path d="M30 56 C46 42, 74 42, 90 56" stroke="#38bdf8" stroke-width="2.5" opacity="0.85" />
    <!-- Mountain Ridges -->
    <path d="M16 94 L42 62 L60 80 L78 54 L104 94 Z" fill="#071329" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Water Wave Surge -->
    <path d="M16 90 C32 80, 48 98, 64 88 C80 78, 92 92, 104 86 L104 102 C88 110, 72 94, 56 104 C40 112, 24 98, 16 102 Z" fill="url(#primaryGrad)" opacity="0.95" />
    <!-- Satellite Beacon & Pulse -->
    <circle cx="60" cy="28" r="8" fill="#00f2fe" filter="url(#logoGlow)" />
    <circle cx="60" cy="28" r="3.5" fill="#ffffff" />
    <line x1="60" y1="36" x2="60" y2="52" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="33" x2="42" y2="43" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
    <line x1="68" y1="33" x2="78" y2="43" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="195" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="2">FLOODVISTA<tspan fill="#00f2fe">.AI</tspan></text>
  
  <text x="198" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="3">MULTIMODAL SATELLITE RADAR &amp; DISASTER RESILIENCE ENGINE</text>
  
  <text x="198" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="0.5">Track B: Mapping Flood Damage from Space &bull; Trishuli Corridor, Nepal 2026</text>

  <!-- Status Chip -->
  <g transform="translate(640, 32)">
    <rect width="130" height="28" rx="14" fill="#022c22" stroke="#059669" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#34d399" letter-spacing="1">LIVE DEMO</text>
  </g>
</svg>
