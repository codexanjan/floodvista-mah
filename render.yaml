services:
  - type: web
    name: floodvista-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn floodmap.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: ./src
      - key: PYTHON_VERSION
        value: 3.11.9
